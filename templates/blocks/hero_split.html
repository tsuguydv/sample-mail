<tr>
  <td class="mobile-padding" style="padding:34px 32px 30px 32px; background-color:{{ surface_color }};">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td class="stack-column" width="52%" valign="middle" style="font-family:{{ font_family }};">
          <div style="font-size:13px; line-height:20px; color:{{ accent_color }}; font-weight:bold; text-transform:uppercase;">{{ eyebrow }}</div>
          <h1 style="margin:10px 0 12px 0; font-size:30px; line-height:38px; color:{{ text_color }}; font-weight:bold;">{{ title }}</h1>
          <p style="margin:0 0 20px 0; font-size:16px; line-height:25px; color:{{ muted_color }};">{{ subtitle }}</p>
          <table role="presentation" cellpadding="0" cellspacing="0" border="0">
            <tr>
              <td bgcolor="{{ primary_color }}" style="border-radius:6px;">
                <a href="{{ button_url }}" style="display:inline-block; padding:13px 22px; font-family:{{ font_family }}; font-size:14px; line-height:20px; color:#ffffff; font-weight:bold;">{{ button_text }}</a>
              </td>
            </tr>
          </table>
        </td>
        <td class="stack-column mobile-spacer" width="24" style="font-size:0; line-height:0;">&nbsp;</td>
        <td class="stack-column" width="43%" valign="middle">
          <img class="fluid-img" src="{{ image_url }}" width="248" alt="{{ image_alt }}" style="width:100%; max-width:248px; height:auto; border-radius:8px;">
        </td>
      </tr>
    </table>
  </td>
</tr>

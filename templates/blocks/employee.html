<tr>
  <td class="mobile-padding" style="padding:28px 32px; background-color:{{ surface_color }};">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid {{ border_color }}; border-radius:8px;">
      <tr>
        <td width="120" valign="top" style="padding:20px;">
          <img src="{{ image_url }}" width="96" height="96" alt="{{ name }}" style="width:96px; height:96px; border-radius:48px;">
        </td>
        <td valign="middle" style="padding:20px 20px 20px 0; font-family:{{ font_family }};">
          <div style="font-size:18px; line-height:24px; color:{{ text_color }}; font-weight:bold;">{{ name }}</div>
          <div style="padding-top:3px; font-size:14px; line-height:20px; color:{{ primary_color }};">{{ role }}</div>
          <div style="padding-top:8px; font-size:14px; line-height:22px; color:{{ muted_color }};">{{ bio }}</div>
        </td>
      </tr>
    </table>
  </td>
</tr>

<tr>
  <td class="mobile-padding" style="padding:28px 32px; background-color:{{ surface_color }};">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f7f9fd; border-left:4px solid {{ primary_color }};">
      <tr>
        <td style="padding:22px 24px; font-family:{{ font_family }};">
          <div style="font-size:18px; line-height:28px; color:{{ text_color }}; font-weight:bold;">“{{ quote }}”</div>
          <div style="padding-top:12px; font-size:14px; line-height:20px; color:{{ muted_color }};">{{ author }}{% if role %}, {{ role }}{% endif %}</div>
        </td>
      </tr>
    </table>
  </td>
</tr>

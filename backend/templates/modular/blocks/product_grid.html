<tr>
  <td class="mobile-padding" style="padding:30px 32px; background-color:{{ surface_color }};">
    <h2 style="margin:0 0 18px 0; font-family:{{ font_family }}; font-size:24px; line-height:32px; color:{{ text_color }}; text-align:center;">{{ title }}</h2>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr>
        {% for product in products %}
        <td class="stack-column" width="33.33%" valign="top" style="padding:0 8px 12px 8px; font-family:{{ font_family }};">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid {{ border_color }}; border-radius:8px;">
            <tr>
              <td style="padding:12px;">
                <img class="fluid-img" src="{{ product.image_url }}" width="160" alt="{{ product.title }}" style="width:100%; max-width:160px; height:auto; border-radius:6px;">
                <div style="padding-top:10px; font-size:15px; line-height:21px; color:{{ text_color }}; font-weight:bold;">{{ product.title }}</div>
                <div style="padding-top:4px; font-size:14px; line-height:20px; color:{{ primary_color }}; font-weight:bold;">{{ product.price }}</div>
                <a href="{{ product.button_url }}" style="display:inline-block; padding-top:8px; font-size:13px; line-height:19px; color:{{ primary_color }}; font-weight:bold;">В корзину</a>
              </td>
            </tr>
          </table>
        </td>
        {% endfor %}
      </tr>
    </table>
  </td>
</tr>

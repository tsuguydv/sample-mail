<tr>
  <td class="mobile-padding" style="padding:28px 32px; background-color:{{ surface_color }};">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="{{ primary_color }}" style="background-color:{{ primary_color }}; border-radius:8px;">
      <tr>
        <td align="center" style="padding:28px; font-family:{{ font_family }};">
          <h2 style="margin:0 0 8px 0; font-size:26px; line-height:34px; color:#ffffff;">{{ title }}</h2>
          <p style="margin:0 0 18px 0; font-size:15px; line-height:24px; color:#eaf0ff;">{{ text }}</p>
          <table role="presentation" cellpadding="0" cellspacing="0" border="0">
            <tr>
              <td bgcolor="#ffffff" style="border-radius:6px;">
                <a href="{{ button_url }}" style="display:inline-block; padding:12px 22px; font-family:{{ font_family }}; font-size:14px; line-height:20px; color:{{ primary_dark }}; font-weight:bold;">{{ button_text }}</a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </td>
</tr>

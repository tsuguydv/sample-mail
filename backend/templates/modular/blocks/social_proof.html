<tr>
  <td class="mobile-padding" style="padding:28px 32px; background-color:{{ surface_color }};">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f7f9fd; border-radius:8px;">
      <tr>
        <td class="stack-column mobile-center" style="padding:22px; font-family:{{ font_family }};">
          <h2 style="margin:0 0 6px 0; font-size:22px; line-height:30px; color:{{ text_color }};">{{ title }}</h2>
          <div style="font-size:15px; line-height:23px; color:{{ muted_color }};">{{ text }}</div>
        </td>
        <td class="stack-column mobile-center" align="right" style="padding:22px; font-family:{{ font_family }};">
          <div style="font-size:28px; line-height:34px; color:{{ primary_color }}; font-weight:bold;">{{ metric }}</div>
          <div style="font-size:13px; line-height:19px; color:{{ muted_color }};">{{ metric_label }}</div>
        </td>
      </tr>
    </table>
  </td>
</tr>

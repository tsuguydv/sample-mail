<tr>
  <td class="mobile-padding" style="padding:30px 32px; background-color:{{ surface_color }};">
    <h2 style="margin:0 0 18px 0; font-family:{{ font_family }}; font-size:24px; line-height:32px; color:{{ text_color }}; text-align:center;">{{ title }}</h2>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr>
        {% for plan in plans %}
        <td class="stack-column" width="33.33%" valign="top" style="padding:0 8px 12px 8px; font-family:{{ font_family }};">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid {{ border_color }}; border-radius:8px;">
            <tr>
              <td style="padding:18px; text-align:center;">
                <div style="font-size:16px; line-height:22px; color:{{ text_color }}; font-weight:bold;">{{ plan.name }}</div>
                <div style="padding-top:8px; font-size:24px; line-height:30px; color:{{ primary_color }}; font-weight:bold;">{{ plan.price }}</div>
                <div style="padding-top:8px; font-size:13px; line-height:20px; color:{{ muted_color }};">{{ plan.description }}</div>
                <a href="{{ plan.button_url }}" style="display:inline-block; padding-top:12px; font-size:14px; line-height:20px; color:{{ primary_color }}; font-weight:bold;">{{ plan.button_text }}</a>
              </td>
            </tr>
          </table>
        </td>
        {% endfor %}
      </tr>
    </table>
  </td>
</tr>

<tr>
  <td class="mobile-padding" style="padding:30px 32px; background-color:{{ surface_color }};">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td style="font-family:{{ font_family }};">
          <h2 style="margin:0 0 12px 0; font-size:24px; line-height:32px; color:{{ text_color }};">{{ title }}</h2>
          {% for paragraph in paragraphs %}
          <p style="margin:0 0 12px 0; font-size:15px; line-height:24px; color:{{ muted_color }};">{{ paragraph }}</p>
          {% endfor %}
        </td>
      </tr>
    </table>
  </td>
</tr>

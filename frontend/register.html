<!doctype html>
<html lang="ru" data-page-title="page.title.register">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>smart-letters — Регистрация</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>

  <main class="center-screen">
    <div class="container container-narrow" style="max-width:420px;">
      <div style="text-align:center;">
        <a href="index.html" style="display:inline-block; font-size:24px; font-weight:800; color: var(--primary); text-decoration:none;">smart-letters</a>
        <div class="spacer-2"></div>
        <h1 class="h3" style="margin-top:8px;" data-i18n="register.title">Создание аккаунта</h1>
      </div>

      <div class="spacer-4"></div>

      <form id="register-form" class="card card-pad" style="display:grid; gap:14px;">
        <div>
          <label class="label" for="email" data-i18n="register.label.email">Email</label>
          <input class="input" id="email" name="email" type="email" autocomplete="email" required />
        </div>
        <div>
          <label class="label" for="password" data-i18n="register.label.password">Пароль</label>
          <input class="input" id="password" name="password" type="password" autocomplete="new-password" required minlength="6" />
        </div>
        <label class="small" style="display:flex; gap:8px; align-items:flex-start;">
          <input id="legal-consent" type="checkbox" required style="margin-top:3px;" />
          <span data-i18n-html="register.legalConsent">
            I agree to the <a href="terms.html" target="_blank" rel="noopener">Terms</a> and
            <a href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.
          </span>
        </label>
        <p id="register-error" class="error" role="alert" style="display:none;"></p>
        <button class="btn btn-primary" id="register-submit" type="submit" data-i18n="register.button">Зарегистрироваться</button>
      </form>

      <div class="spacer-4"></div>
      <p class="small muted" style="text-align:center;">
        <span data-i18n="register.footer.hasaccount">Уже есть аккаунт?</span>
        <a href="login.html" data-i18n="register.footer.login">Войти</a>
      </p>
    </div>
  </main>

  <script src="assets/api.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/ui.js"></script>
  <script>
    (function(){
      const form = document.getElementById("register-form");
      const err = document.getElementById("register-error");
      const btn = document.getElementById("register-submit");
      const emailInput = document.getElementById("email");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        err.style.display = "none";
        btn.disabled = true;

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const legalConsentAccepted = !!document.getElementById("legal-consent").checked;

        try{
          const res = await API.register(email, password, legalConsentAccepted);
          // Verification-first flow: token may be empty until email is verified.
          if(res && res.token){
            Store.setToken(res.token);
            window.location.href = "company.html";
          }else{
            err.textContent = "Registration successful. Please verify your email, then sign in.";
            err.style.display = "block";
            const em = (emailInput.value || "").trim();
            if(em){
              await API.resendVerification(em).catch(() => {});
            }
          }
        }catch(ex){
          const rd = (typeof I18N !== "undefined" && I18N[Store.getLanguage()]) ? I18N[Store.getLanguage()] : {};
          err.textContent = (ex && ex.message) ? ex.message : (rd["register.error"] || "Registration error");
          err.style.display = "block";
        }finally{
          btn.disabled = false;
        }
      });
    })();
  </script>

</body>
</html>

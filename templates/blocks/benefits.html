<tr>
  <td class="mobile-padding" style="padding:30px 32px; background-color:{{ surface_color }};">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td style="font-family:{{ font_family }};">
          <h2 style="margin:0 0 18px 0; font-size:24px; line-height:32px; color:{{ text_color }}; text-align:center;">{{ title }}</h2>
        </td>
      </tr>
      <tr>
        {% for benefit in benefits %}
        <td class="stack-column" width="33.33%" valign="top" style="padding:0 8px 12px 8px; font-family:{{ font_family }};">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid {{ border_color }}; border-radius:8px;">
            <tr>
              <td style="padding:18px;">
                <div style="font-size:16px; line-height:22px; color:{{ text_color }}; font-weight:bold;">{{ benefit.title }}</div>
                <div style="padding-top:8px; font-size:14px; line-height:21px; color:{{ muted_color }};">{{ benefit.text }}</div>
              </td>
            </tr>
          </table>
        </td>
        {% endfor %}
      </tr>
    </table>
  </td>
</tr>

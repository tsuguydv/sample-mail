<tr>
  <td class="mobile-padding" style="padding:30px 32px; background-color:{{ surface_color }};">
    <h2 style="margin:0 0 18px 0; font-family:{{ font_family }}; font-size:24px; line-height:32px; color:{{ text_color }};">{{ title }}</h2>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      {% for step in steps %}
      <tr>
        <td width="44" valign="top" style="padding:0 14px 18px 0; font-family:{{ font_family }};">
          <div style="width:34px; height:34px; line-height:34px; border-radius:17px; background-color:{{ accent_color }}; color:#ffffff; text-align:center; font-size:14px; font-weight:bold;">{{ step.label }}</div>
        </td>
        <td valign="top" style="padding:0 0 18px 0; font-family:{{ font_family }};">
          <div style="font-size:17px; line-height:24px; color:{{ text_color }}; font-weight:bold;">{{ step.title }}</div>
          <div style="padding-top:4px; font-size:14px; line-height:22px; color:{{ muted_color }};">{{ step.text }}</div>
        </td>
      </tr>
      {% endfor %}
    </table>
  </td>
</tr>

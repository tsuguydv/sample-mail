<tr>
  <td class="mobile-padding" style="padding:28px 32px; background-color:{{ surface_color }};">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f7f9fd; border-radius:8px;">
      <tr>
        {% for stat in stats %}
        <td class="stack-column" width="33.33%" align="center" style="padding:22px 10px; font-family:{{ font_family }};">
          <div style="font-size:30px; line-height:36px; color:{{ primary_color }}; font-weight:bold;">{{ stat.value }}</div>
          <div style="padding-top:5px; font-size:13px; line-height:19px; color:{{ muted_color }};">{{ stat.label }}</div>
        </td>
        {% endfor %}
      </tr>
    </table>
  </td>
</tr>

<tr>
  <td class="mobile-padding" style="padding:30px 32px; background-color:{{ surface_color }};">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid {{ border_color }}; border-radius:8px;">
      <tr>
        <td class="stack-column mobile-center" style="padding:22px; font-family:{{ font_family }};">
          <h2 style="margin:0 0 6px 0; font-size:22px; line-height:28px; color:{{ text_color }};">{{ title }}</h2>
          <p style="margin:0; font-size:15px; line-height:23px; color:{{ muted_color }};">{{ text }}</p>
        </td>
        <td class="stack-column mobile-center" align="right" style="padding:22px;">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="right">
            <tr>
              <td bgcolor="{{ primary_color }}" style="border-radius:6px;">
                <a href="{{ button_url }}" style="display:inline-block; padding:12px 20px; font-family:{{ font_family }}; font-size:14px; line-height:20px; color:#ffffff; font-weight:bold;">{{ button_text }}</a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </td>
</tr>

<tr>
  <td class="mobile-padding" style="padding:26px 32px 30px 32px; background-color:#f7f9fd; border-top:1px solid {{ border_color }};">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td align="center" style="font-family:{{ font_family }};">
          <div style="font-size:14px; line-height:22px; color:{{ text_color }}; font-weight:bold;">{{ company_name }}</div>
          <div style="padding-top:4px; font-size:13px; line-height:20px; color:{{ muted_color }};">{{ address }}</div>
          <div style="padding-top:12px;">
            {% for link in social_links %}
            <a href="{{ link.url }}" style="font-size:13px; line-height:20px; color:{{ primary_color }}; margin:0 6px;">{{ link.title }}</a>
            {% endfor %}
          </div>
          <div style="padding-top:12px; font-size:12px; line-height:18px; color:{{ muted_color }};">
            Вы получили это письмо, потому что подписались на обновления.
            <a href="{{ unsubscribe_url }}" style="color:{{ primary_color }};">{{ unsubscribe_text }}</a>
          </div>
        </td>
      </tr>
    </table>
  </td>
</tr>

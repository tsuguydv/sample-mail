<tr>
  <td class="mobile-padding" style="padding:28px 32px; background-color:{{ surface_color }};">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td class="stack-column" valign="middle" style="font-family:{{ font_family }};">
          <h2 style="margin:0 0 10px 0; font-size:22px; line-height:30px; color:{{ text_color }};">{{ title }}</h2>
          <p style="margin:0 0 14px 0; font-size:15px; line-height:24px; color:{{ muted_color }};">{{ text }}</p>
          <a href="{{ button_url }}" style="font-size:15px; line-height:22px; color:{{ primary_color }}; font-weight:bold;">{{ button_text }}</a>
        </td>
        <td class="stack-column mobile-spacer" width="24" style="font-size:0; line-height:0;">&nbsp;</td>
        <td class="stack-column" width="45%" valign="top">
          <img class="fluid-img" src="{{ image_url }}" width="252" alt="{{ image_alt }}" style="width:100%; max-width:252px; height:auto; border-radius:8px;">
        </td>
      </tr>
    </table>
  </td>
</tr>

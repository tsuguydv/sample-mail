<tr>
  <td class="mobile-padding" style="padding:28px 32px; background-color:{{ surface_color }};">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid {{ border_color }}; border-radius:8px;">
      <tr>
        <td style="padding:22px; font-family:{{ font_family }};">
          <h2 style="margin:0 0 8px 0; font-size:22px; line-height:30px; color:{{ text_color }};">{{ title }}</h2>
          <p style="margin:0 0 12px 0; font-size:15px; line-height:24px; color:{{ muted_color }};">{{ text }}</p>
          {% for item in items %}
          <div style="font-size:14px; line-height:22px; color:{{ text_color }};">• {{ item }}</div>
          {% endfor %}
          <a href="{{ button_url }}" style="display:inline-block; padding-top:14px; font-size:15px; line-height:22px; color:{{ primary_color }}; font-weight:bold;">{{ button_text }}</a>
        </td>
      </tr>
    </table>
  </td>
</tr>

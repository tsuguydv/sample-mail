<tr>
  <td class="mobile-padding" style="padding:30px 32px; background-color:{{ surface_color }};">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-left:4px solid {{ accent_color }}; background-color:#f7fbfa;">
      <tr>
        <td style="padding:22px 24px; font-family:{{ font_family }};">
          <div style="font-size:13px; line-height:20px; color:{{ accent_color }}; font-weight:bold; text-transform:uppercase;">{{ label }}</div>
          <h2 style="margin:6px 0 10px 0; font-size:22px; line-height:30px; color:{{ text_color }};">{{ title }}</h2>
          <p style="margin:0 0 12px 0; font-size:15px; line-height:24px; color:{{ muted_color }};">{{ text }}</p>
          <div style="font-size:18px; line-height:26px; color:{{ text_color }}; font-weight:bold;">{{ result }}</div>
        </td>
      </tr>
    </table>
  </td>
</tr>

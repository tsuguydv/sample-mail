<tr>
  <td class="mobile-padding" style="padding:28px 32px; background-color:{{ surface_color }};">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid {{ border_color }}; border-radius:8px;">
      <tr>
        <td style="padding:18px;">
          <img class="fluid-img" src="{{ image_url }}" width="540" alt="{{ title }}" style="width:100%; max-width:540px; height:auto; border-radius:8px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
            <tr>
              <td style="padding-top:16px; font-family:{{ font_family }};">
                <div style="font-size:20px; line-height:28px; color:{{ text_color }}; font-weight:bold;">{{ title }}</div>
                <div style="padding-top:4px; font-size:18px; line-height:26px; color:{{ primary_color }}; font-weight:bold;">{{ price }}</div>
              </td>
              <td align="right" style="padding-top:16px;">
                <a href="{{ button_url }}" style="font-family:{{ font_family }}; font-size:14px; line-height:20px; color:{{ primary_color }}; font-weight:bold;">{{ button_text }}</a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </td>
</tr>

<tr>
  <td class="mobile-padding" style="padding:26px 32px 18px 32px; background-color:{{ surface_color }}; border-bottom:1px solid {{ border_color }};">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td class="stack-column mobile-center" valign="middle" style="font-family:{{ font_family }}; color:{{ text_color }};">
          <a href="{{ brand_url }}" style="font-size:22px; line-height:28px; font-weight:bold; color:{{ text_color }};">{{ logo_text }}</a>
          <div style="font-size:13px; line-height:20px; color:{{ muted_color }};">{{ tagline }}</div>
        </td>
        <td class="stack-column mobile-center" valign="middle" align="right" style="font-family:{{ font_family }}; padding-top:6px;">
          <a href="{{ view_url }}" style="font-size:13px; line-height:20px; color:{{ primary_color }};">{{ view_text }}</a>
        </td>
      </tr>
    </table>
  </td>
</tr>

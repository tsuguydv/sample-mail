<tr>
  <td class="mobile-padding" style="padding:30px 32px; background-color:{{ surface_color }};">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid {{ border_color }}; border-radius:8px;">
      <tr>
        <td style="padding:22px; font-family:{{ font_family }};">
          <h2 style="margin:0 0 14px 0; font-size:22px; line-height:30px; color:{{ text_color }};">{{ title }}</h2>
          {% for item in items %}
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
            <tr>
              <td width="28" valign="top" style="padding:2px 10px 12px 0;">
                <div style="width:20px; height:20px; line-height:20px; border-radius:10px; background-color:{{ accent_color }}; color:#ffffff; font-family:{{ font_family }}; font-size:12px; text-align:center; font-weight:bold;">✓</div>
              </td>
              <td valign="top" style="padding:0 0 12px 0; font-size:15px; line-height:23px; color:{{ muted_color }};">{{ item }}</td>
            </tr>
          </table>
          {% endfor %}
        </td>
      </tr>
    </table>
  </td>
</tr>

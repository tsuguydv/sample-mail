<tr>
  <td class="mobile-padding" style="padding:28px 32px; background-color:{{ surface_color }};">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td style="background-color:{{ text_color }}; border-radius:8px;">
          <a href="{{ button_url }}">
            <img class="fluid-img" src="{{ image_url }}" width="576" alt="{{ image_alt }}" style="width:100%; max-width:576px; height:auto; border-radius:8px;">
          </a>
        </td>
      </tr>
      <tr>
        <td align="center" style="padding-top:18px; font-family:{{ font_family }};">
          <h2 style="margin:0 0 14px 0; font-size:22px; line-height:30px; color:{{ text_color }};">{{ title }}</h2>
          <a href="{{ button_url }}" style="font-size:15px; line-height:22px; color:{{ primary_color }}; font-weight:bold;">{{ button_text }}</a>
        </td>
      </tr>
    </table>
  </td>
</tr>

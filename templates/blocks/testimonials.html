<tr>
  <td class="mobile-padding" style="padding:30px 32px; background-color:{{ surface_color }};">
    <h2 style="margin:0 0 18px 0; font-family:{{ font_family }}; font-size:24px; line-height:32px; color:{{ text_color }}; text-align:center;">{{ title }}</h2>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr>
        {% for item in items %}
        <td class="stack-column" width="50%" valign="top" style="padding:0 8px 12px 8px; font-family:{{ font_family }};">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid {{ border_color }}; border-radius:8px;">
            <tr>
              <td style="padding:18px;">
                <div style="font-size:15px; line-height:23px; color:{{ muted_color }};">“{{ item.quote }}”</div>
                <div style="padding-top:12px; font-size:14px; line-height:20px; color:{{ text_color }}; font-weight:bold;">{{ item.author }}</div>
                <div style="font-size:13px; line-height:19px; color:{{ muted_color }};">{{ item.role }}</div>
              </td>
            </tr>
          </table>
        </td>
        {% endfor %}
      </tr>
    </table>
  </td>
</tr>

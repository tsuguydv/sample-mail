<tr>
  <td class="mobile-padding" style="padding:28px 32px; background-color:{{ surface_color }};">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f7fbfa" style="background-color:#f7fbfa; border:2px dashed {{ accent_color }}; border-radius:8px;">
      <tr>
        <td class="stack-column mobile-center" style="padding:22px; font-family:{{ font_family }};">
          <div style="font-size:13px; line-height:20px; color:{{ accent_color }}; font-weight:bold; text-transform:uppercase;">{{ label }}</div>
          <h2 style="margin:6px 0 6px 0; font-size:24px; line-height:32px; color:{{ text_color }};">{{ title }}</h2>
          <div style="font-size:14px; line-height:22px; color:{{ muted_color }};">{{ text }}</div>
        </td>
        <td class="stack-column mobile-center" align="right" style="padding:22px; font-family:{{ font_family }};">
          <div style="display:inline-block; padding:12px 18px; border:1px solid {{ accent_color }}; border-radius:6px; font-size:20px; line-height:26px; color:{{ text_color }}; font-weight:bold; letter-spacing:0;">{{ code }}</div>
          <div style="padding-top:8px;">
            <a href="{{ button_url }}" style="font-size:14px; line-height:20px; color:{{ primary_color }}; font-weight:bold;">{{ button_text }}</a>
          </div>
        </td>
      </tr>
    </table>
  </td>
</tr>

<tr>
  <td class="mobile-padding" style="padding:28px 32px; background-color:{{ surface_color }};">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="{{ primary_dark }}" style="background-color:{{ primary_dark }}; border-radius:8px;">
      <tr>
        <td align="center" style="padding:30px 26px; font-family:{{ font_family }};">
          <div style="font-size:13px; line-height:20px; color:#bcd0ff; font-weight:bold; text-transform:uppercase;">{{ eyebrow }}</div>
          <h1 style="margin:8px 0 10px 0; font-size:28px; line-height:36px; color:#ffffff; font-weight:bold;">{{ title }}</h1>
          <p style="margin:0 auto 18px auto; max-width:480px; font-size:15px; line-height:24px; color:#eaf0ff;">{{ subtitle }}</p>
          <a href="{{ button_url }}" style="font-size:15px; line-height:22px; color:#ffffff; font-weight:bold;">{{ button_text }}</a>
        </td>
      </tr>
    </table>
  </td>
</tr>

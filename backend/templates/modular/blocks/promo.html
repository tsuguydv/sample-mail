<tr>
  <td class="mobile-padding" style="padding:30px 32px; background-color:{{ surface_color }};">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f7f9fd; border:1px solid {{ border_color }}; border-radius:8px;">
      <tr>
        <td class="stack-column mobile-center" width="34%" align="center" style="padding:24px; font-family:{{ font_family }};">
          <div style="font-size:42px; line-height:48px; color:{{ primary_color }}; font-weight:bold;">{{ discount }}</div>
          <div style="font-size:13px; line-height:19px; color:{{ muted_color }};">промокод {{ code }}</div>
        </td>
        <td class="stack-column mobile-center" style="padding:24px; font-family:{{ font_family }};">
          <h2 style="margin:0 0 8px 0; font-size:24px; line-height:32px; color:{{ text_color }};">{{ title }}</h2>
          <p style="margin:0 0 14px 0; font-size:15px; line-height:24px; color:{{ muted_color }};">{{ text }}</p>
          <a href="{{ button_url }}" style="font-size:15px; line-height:22px; color:{{ primary_color }}; font-weight:bold;">{{ button_text }}</a>
        </td>
      </tr>
    </table>
  </td>
</tr>

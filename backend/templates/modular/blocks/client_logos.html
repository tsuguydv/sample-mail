<tr>
  <td class="mobile-padding" style="padding:28px 32px; background-color:{{ surface_color }};">
    <h2 style="margin:0 0 18px 0; font-family:{{ font_family }}; font-size:22px; line-height:30px; color:{{ text_color }}; text-align:center;">{{ title }}</h2>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr>
        {% for logo in logos %}
        <td class="stack-column" width="25%" align="center" style="padding:10px; font-family:{{ font_family }}; font-size:14px; line-height:20px; color:{{ muted_color }}; font-weight:bold; border:1px solid {{ border_color }};">{{ logo }}</td>
        {% endfor %}
      </tr>
    </table>
  </td>
</tr>
